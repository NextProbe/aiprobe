name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build (must already exist)
        required: true

permissions:
  contents: write

jobs:
  build:
    name: build binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          # The version is stamped from `git describe`, which needs the history.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: verify before publishing
        run: |
          go vet ./...
          go test ./...

      - name: cross-compile
        run: |
          set -euo pipefail
          version=$(git describe --tags --always --dirty)
          mkdir -p dist
          # Cross-compilation is plain `go build`: there is no cgo and no
          # platform-specific code, which is the point of keeping the dependency
          # surface at one library.
          for target in \
            linux/amd64 linux/arm64 \
            darwin/amd64 darwin/arm64 \
            windows/amd64 windows/arm64
          do
            os=${target%/*}
            arch=${target#*/}
            name="aiprobe_${version}_${os}_${arch}"
            out="dist/${name}/aiprobe"
            [ "$os" = windows ] && out="${out}.exe"
            mkdir -p "dist/${name}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath \
                -ldflags "-s -w -X github.com/NextProbe/aiprobe/internal/cli.version=${version}" \
                -o "$out" .
            cp README.md README.zh-CN.md LICENSE CHANGELOG.md "dist/${name}/"
            if [ "$os" = windows ]; then
              (cd dist && zip -qr "${name}.zip" "${name}")
            else
              (cd dist && tar -czf "${name}.tar.gz" "${name}")
            fi
            rm -rf "dist/${name}"
          done
          (cd dist && sha256sum ./* > checksums.txt)
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/

      - name: publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "${GITHUB_REF_NAME}" \
            --notes "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md)." \
            --verify-tag
